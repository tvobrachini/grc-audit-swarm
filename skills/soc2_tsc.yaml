  - "CC7 System Operations & Incident Management (CC7.1-CC7.5)"
  - "CC8 Change Management (CC8.1)"
  - "CC9 Risk Mitigation & Subservice Organizations (CC9.1-CC9.2)"
  - "Availability (A1) & Confidentiality (C1)"

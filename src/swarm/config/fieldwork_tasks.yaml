evidence_collection_task:
  description: |-
    RACM test plan approved at Gate 1 (one block per control):
    {test_plan}

    For each control, run the available read-only tools that produce evidence for its test steps. Do not simulate or paraphrase evidence. For every tool run, copy the tool's response verbatim, including its 'Vault ID:' line, and list the Control-IDs it relates to. Tool results show the configuration at the time of the call (point in time). Finally list the Control-IDs that no available tool covers as 'NO APPLICABLE TOOL'.
  expected_output: "Per tool run: the related Control-IDs, the Vault ID and the raw output verbatim. Then the list of Control-IDs with no applicable tool."

execution_evaluation_task:
  description: |-
    Audit theme: '{theme}'. RACM test plan approved at Gate 1 (one block per control):
    {test_plan}

    The collected evidence (raw tool outputs with their Vault IDs) is in your context. Write one AuditFindingSchema per control in the test plan, in the same order, applying these rules:
    1. Follow each control's stated ToD and ToE steps and conclude against their expected results.
    2. exact_quote_from_evidence must be a verbatim substring of a raw tool output and vault_id_reference that output's Vault ID. Never conclude 'Effective' or 'No exception' without one.
    3. If no collected evidence covers a control, set tod_conclusion and toe_conclusion to 'Not tested', leave the quote and vault ID empty, and say why in test_conclusion.
    4. A point-in-time configuration read is design and implementation evidence (ToD). It is not operating effectiveness over the period of reliance: set toe_conclusion to 'Not tested' and explain in toe_basis, unless the evidence covers the period. For an automated control you may conclude ToE on a test of one only if toe_basis states the reliance on change-management ITGCs for the period and whether those ITGCs were tested. Manual controls need a sample across the period.
    5. Record items_tested and exceptions_noted where applicable. result is 'Exception' if ToD is 'Ineffective' or ToE is 'Exceptions noted' / 'Ineffective'; 'Not tested' if both are 'Not tested'; otherwise 'No exception'. Set preliminary_deficiency to true when an exception indicates a control deficiency.
    6. Do not classify severity (no significant deficiency or material weakness): that is an engagement-level evaluation in Reporting.{qa_feedback}
  expected_output: "A structured list of findings mapped to the WorkingPaperSchema, one per control in the test plan."

eval_qa_gate_task:
  description: |-
    RACM test plan approved at Gate 1:
    {test_plan}

    The collected evidence and the Working Papers are in your context. Reject (approved=false) with a rejection_reason naming each Control-ID and the fix if any check fails:
    1. Every control in the test plan has exactly one finding; no finding for an unknown Control-ID.
    2. Conclusions follow the control's stated test steps and expected results.
    3. No 'Effective' conclusion or 'No exception' result without a quote that appears verbatim in the collected evidence, with the Vault ID shown for that evidence.
    4. 'Not tested' where no evidence tool applies; no conclusion rests on evidence that was not collected.
    5. A single point-in-time configuration read is not concluded as ToE 'Effective' for the period unless toe_basis states the reliance.
    6. An exception visible in the evidence is recorded as an exception, not concluded 'Effective'.
    7. No severity classification (significant deficiency, material weakness) appears in the working papers.
    Otherwise approve.
  expected_output: "A QA_PushbackSchema object validating the Working Papers."

[project]
name = "grc-audit-swarm"
version = "0.1.0"
description = "Human-gated audit workflow: CrewAI agents draft a RACM, working papers and a report, with QA review, three approval gates, read-only AWS evidence and a hashed evidence vault"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tiago Brachini" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pdfplumber>=0.10.3",
    "pydantic>=2.7.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.2",
    "mcp[cli]>=1.26.0",
    "crewai>=1.6.0",
    "litellm>=1.83.7",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.31",
]

[project.urls]
Repository = "https://github.com/tvobrachini/grc-audit-swarm"
Issues = "https://github.com/tvobrachini/grc-audit-swarm/issues"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B105"] # Skip assert and password false-positives

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.0",
    "ruff>=0.15.5",
    "moto[iam,s3,s3control,sts]>=5.1",
]

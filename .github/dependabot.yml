# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # Python dependencies (uv.lock)
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm" # Frontend (React) dependencies
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # @types/node must match the Node.js major we run (24, see
      # frontend/Dockerfile and NODE_VERSION in ci.yml); bump it with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors change the compiler (TS 7 is the native port);
      # evaluate them in a dedicated change rather than as a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions" # GitHub Actions
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker" # Root Dockerfile base image
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The project declares requires-python <3.14 and CI tests 3.11 to 3.13.
      # Stay on the newest tested version (3.13) until 3.14 is supported.
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker" # Frontend Dockerfile base image
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # The build stage tracks the Node.js LTS line (NODE_VERSION in ci.yml
      # must match). Take major versions by hand when they become LTS, not
      # when they are released as "Current".
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # Python dependencies (uv.lock)
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm" # Frontend (React) dependencies
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions" # GitHub Actions
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker" # Root Dockerfile base image
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # crewai pins chromadb~=1.1.0, and chromadb 1.1.x imports pydantic.v1,
      # which fails on Python 3.14. Stay on the newest version CI tests
      # (3.13) until crewai allows a newer chromadb.
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker" # Frontend Dockerfile base image
    directory: "/frontend"
    schedule:
      interval: "weekly"

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # Python dependencies (uv.lock)
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm" # Frontend (React) dependencies
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions" # GitHub Actions
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker" # Root Dockerfile base image
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker" # Frontend Dockerfile base image
    directory: "/frontend"
    schedule:
      interval: "weekly"

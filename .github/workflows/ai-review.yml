name: CodiumAI PR-Agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # Only run for trusted senders, and never for a pull_request event whose
    # head repo is a fork (forks would otherwise get our OPENAI_API_KEY and
    # write access to issues/PRs on the base repo).
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    name: Run PR Agent on every pull request
    steps:
      - name: PR Agent action step
        id: pragent
        uses: Codium-ai/pr-agent@d82f7d3e696cd00822694aaa3096265d3889f3f1 # v0.34
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          pr_description.extra_instructions: "Ensure code uses `uv` for dependencies. Verify no tests are deleted."
          pr_reviewer.extra_instructions: "CRITICAL DOMAIN RULE: If the PR touches agent logic or audit crews, ensure it does NOT allow the AI to pass a control if evidence is missing. Missing evidence = Fail/Exception. Evidence must be registered via EvidenceAssuranceProtocol and verified with verify_exact_quote before any finding can be marked compliant."
          pr_code_suggestions.extra_instructions: "Enforce DDD AuthContext guidelines. Ensure no remediation steps are added to the execution phase. Check for proper Pydantic validations."

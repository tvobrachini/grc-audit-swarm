services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - EVIDENCE_VAULT_PATH=/app/data/evidence_vault
      - SESSIONS_PATH=/app/data/audit_sessions.json
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  streamlit:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    profiles: ["streamlit"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - EVIDENCE_VAULT_PATH=/app/data/evidence_vault
      - SESSIONS_PATH=/app/data/audit_sessions.json
    env_file: .env
    restart: unless-stopped

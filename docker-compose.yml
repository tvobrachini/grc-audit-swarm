services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    # Named volume, not a ./data bind mount: the API runs as the non-root
    # `app` user, and Docker seeds a new named volume from the image's
    # /app/data (owned by `app`), so it stays writable. A host bind mount is
    # owned by root or the host user and the API could not write to it.
    volumes:
      - app-data:/app/data
    environment:
      - EVIDENCE_VAULT_PATH=/app/data/evidence_vault
      - SESSIONS_PATH=/app/data/audit_sessions.json
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    # Only the API token is needed here (nginx injects it into /api requests);
    # compose interpolates it from .env, so the LLM and AWS keys stay out of
    # this container.
    environment:
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app-data:
